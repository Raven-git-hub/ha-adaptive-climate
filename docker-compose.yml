# Adaptive Climate - deployment
#
#   docker compose up -d
#
# Port 8098 (Adaptive Light holds 8099), so both can run on one host.
# No /share or /config mount is needed: the almanac reaches Home Assistant
# over the REST API rather than by writing a file. The only volume is the
# container's own data directory.

services:
  adaptive-climate:
    build: .
    image: adaptive-climate:latest
    container_name: adaptive-climate
    restart: unless-stopped

    ports:
      - "8098:8098"

    volumes:
      # Config, SQLite database, CSV archive. Everything except the CSV
      # archive is rebuildable; back this up.
      - ./data:/data

    environment:
      TZ: ${TZ:-Etc/UTC}
      AC_HA_URL: ${AC_HA_URL}
      AC_HA_TOKEN: ${AC_HA_TOKEN}
      AC_HA_VERIFY_SSL: ${AC_HA_VERIFY_SSL:-true}
      AC_DATA_DIR: /data
      AC_LOG_LEVEL: ${AC_LOG_LEVEL:-info}

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8098/healthz', timeout=3).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
